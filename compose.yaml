name: home-stock

services:
  api:
    build:
      context: .
      dockerfile: WebAPI/Dockerfile
    image: home-stock-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-homestock};Username=${POSTGRES_USER:-homestock};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      Jwt__Issuer: ${JWT_ISSUER:-home-stock}
      Jwt__Audience: ${JWT_AUDIENCE:-home-stock-clients}
      Jwt__Key: ${JWT_KEY:?set a random JWT_KEY of at least 32 bytes in .env}
      Database__AutoMigrate: ${DATABASE_AUTO_MIGRATE:-true}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [backend, edge]

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homestock}
      POSTGRES_USER: ${POSTGRES_USER:-homestock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  edge:
