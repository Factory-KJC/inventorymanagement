name: home-stock

services:
  api:
    build:
      context: .
      dockerfile: WebAPI/Dockerfile
    image: home-stock-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-homestock};Username=${POSTGRES_USER:-homestock};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      Jwt__Issuer: ${JWT_ISSUER:-home-stock}
      Jwt__Audience: ${JWT_AUDIENCE:-home-stock-clients}
      Jwt__Key: ${JWT_KEY:?set a random JWT_KEY of at least 32 bytes in .env}
      Setup__Token: ${SETUP_TOKEN:?set a one-time SETUP_TOKEN in .env}
      Database__AutoMigrate: ${DATABASE_AUTO_MIGRATE:-true}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
      PrintWorker__ApiKey: ${PRINT_WORKER_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [backend, edge]

  print-worker:
    profiles: [printing]
    build:
      context: PrintWorker
    image: home-stock-print-worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      PRINT_API_URL: http://api:8080
      PRINT_WORKER_API_KEY: ${PRINT_WORKER_API_KEY:?set a random PRINT_WORKER_API_KEY in .env}
      PRINTER_HOST: ${PRINTER_HOST:?set the printer LAN address in .env}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [backend, edge]

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homestock}
      POSTGRES_USER: ${POSTGRES_USER:-homestock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [backend, db-admin]

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  edge:
  db-admin:
